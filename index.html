function encodeProgress(o){return 'STS1.'+btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function decodeProgress(text){if(typeof text!=='string'||text.length>6000)throw Error('length');let match=text.match(/STS1\.([A-Za-z0-9_-]+)/);if(!match)throw Error('prefix');let token=match[1];let raw=atob(token.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-token.length%4)%4));let o=JSON.parse(decodeURIComponent(escape(raw)));if(!o||o.v!==1||typeof o.n!=='string'||o.n.trim().length<1||o.n.length>32||typeof o.s!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(o.s)||typeof o.t!=='string'||!Number.isFinite(Date.parse(o.t))||!Array.isArray(o.c)||o.c.length!==48)throw Error('schema');if(!o.c.every((n,i)=>Number.isSafeInteger(n)&&n>=0&&n<=W[i].exercises.length))throw Error('counts');if(!Number.isSafeInteger(o.r)||o.r<0||o.r>100000000||!Number.isSafeInteger(o.q)||o.q<0||o.q>1000)throw Error('reps');return {v:1,n:o.n.trim(),s:o.s,t:o.t,c:o.c,r:o.r,q:o.q}}

function renderFriends(){let mine=mySnapshot(),all=[{...mine,self:true},...Object.values(data.friends?.peers||{}).filter(x=>x&&Array.isArray(x.c)&&x.c.length===48).map(x=>({...x,self:false}))];all.sort((a,b)=>{let aa=metrics(a),bb=metrics(b);return bb.exercises-aa.exercises||bb.completed-aa.completed||Number(b.self)-Number(a.self)});return `${header(tr('friendsTitle'),tr('friendsSub'))}<main class="main"><button class="button" data-action="open-forum" style="margin:0 0 12px">💬 ${data.lang==='pl'?'Czat drużyny':'Team chat'}</button><section class="card friends-card forum-panel" data-thread="general" data-members="true"></section><p class="smallprint">${tr('friendsIntro')}</p><div class="sectionline"><h2>${data.lang==='pl'?'Zapisane wyniki':'Saved progress'}</h2><span class="caption">${all.length} ${all.length===1?tr('you'):''}</span></div><section class="card friends-card">${all.map((item,i)=>{let m=metrics(item);return `<div class="leader"><div class="leader-top"><div class="leader-rank">${i+1}</div><div class="leader-name">${esc(item.n||tr('you'))} ${item.self?`<span class="self-marker">(${tr('you')})</span>`:''}</div><div class="leader-score">${m.exercises}/${TOTAL_EXERCISES}</div></div><div class="friend-meter"><div style="width:${(m.exercises/TOTAL_EXERCISES*100).toFixed(2)}%"></div></div><div class="leader-meta">${m.completed}/48 ${ux('days')} · ${progressPosition(m.furthest)}${m.repEntries?` · ${m.reps.toLocaleString(data.lang==='pl'?'pl-PL':'en-GB')} ${tr('reps')}`:''}</div>${!item.self?`<div class="leader-meta">${tr('snapshotAt')}: ${esc(prettyDate(item.t.slice(0,10)))}</div><button class="remove-friend" data-action="remove-friend" data-peer="${esc(item.n.toLocaleLowerCase())}">${tr('removeFriend')}</button>`:''}${friendAchievements(item)}</div>`}).join('')}</section><p class="smallprint">${tr('totalRepHint')}</p><section class="card friends-card"><h3>${tr('shareProgress')}</h3><label for="friends-name" class="caption">${tr('yourName')}</label><input id="friends-name" class="friend-input" maxlength="32" autocomplete="nickname" placeholder="${tr('namePlaceholder')}" value="${esc(data.friends?.displayName||'')}"><button class="button" data-action="make-share">${tr('shareProgress')}</button>${shareCode?`<textarea class="share-code" id="share-code" readonly aria-label="${tr('copyCode')}">${esc(shareCode)}</textarea><div class="friends-actions"><button class="button secondary" data-action="copy-share">${tr('copyCode')}</button><button class="button secondary" data-action="send-share">${tr('sendCode')}</button></div>`:''}<div class="friends-help">${tr('shareHelp')}</div></section><section class="card friends-card"><h3>${tr('friendCode')}</h3><textarea class="share-code" id="friend-import" maxlength="6000" placeholder="${tr('friendCodePlaceholder')}"></textarea><button class="button" data-action="add-friend">${tr('addFriend')}</button><div class="friends-help">${tr('noAutoSync')}</div></section></main>${nav()}`}

function renderSettings(){let n=data.notifications||{started:true,finished:true,all:false};const pref=(key,title,desc,checked,disabled=false)=>`<label class="notification-option"><input type="checkbox" data-action="notification-pref" data-pref="${key}" ${checked?'checked':''} ${disabled?'disabled':''}><span><strong>${tr(title)}</strong><small>${tr(desc)}</small></span></label>`;return `${header(tr('settings'),tr('subtitle'))}<main class="main"><section class="card settings forum-panel" data-thread="account"><h3>${data.lang==='pl'?'Konto i logowanie':'Account & sign-in'}</h3></section><section class="card settings"><h3>${tr('notificationTitle')}</h3><p>${tr('notificationInfo')}</p><div class="notification-choices">${pref('started','notificationStart','notificationStartInfo',n.started,n.all)}${pref('finished','notificationFinish','notificationFinishInfo',n.finished,n.all)}${pref('all','notificationAll','notificationAllInfo',n.all)}</div><p class="notification-pending">${tr('notificationPending')}</p></section>${renderMessageSettings()}<section class="card settings"><h3>${tr('startDate')}</h3><p>${tr('startExplain')}</p><input class="dateinput" type="date" data-action="start-date" value="${esc(data.startDate)}"></section><section class="card settings"><h3>${tr('dataTitle')}</h3><p>${tr('dataExplain')}</p><div class="actions"><button class="button" data-action="export">↓ ${tr('export')}</button><button class="button secondary" data-action="import">↑ ${tr('import')}</button></div></section><section class="card settings"><h3>${tr('installTitle')}</h3><p>${tr('installExplain')}</p><button class="button secondary hidden" id="install-btn" data-action="install">${tr('install')}</button></section><section class="card settings"><h3>${tr('aboutTitle')}</h3><p>${tr('about')}</p><p><a href="./guide.html" style="color:var(--green);font-weight:750">${data.lang==='pl'?'Krótka instrukcja obsługi →':'Quick guide →'}</a></p><button class="button danger" data-action="reset">${tr('reset')}</button></section></main>${nav()}`}
function render(){previousTeamTotals??=JSON.stringify(teamTotals());document.documentElement.lang=data.lang;document.title=data.lang==='pl'?'Mój trening · 12 tygodni':'My Workout · 12 weeks';el.innerHTML=screen==='bruce'?renderBruce():screen==='workout'?renderWorkout():screen==='history'?renderHistory():screen==='forum'?renderForum():screen==='stats'?renderStats():screen==='friends'?renderFriends():screen==='settings'?renderSettings():renderPlan();const btn=document.getElementById('install-btn');if(btn&&installPrompt)btn.classList.remove('hidden');window.MyWorkoutForum?.mount({teamTotals,notificationSettings:renderMessageSettings,lang:data.lang,friendName:data.friends?.displayName||'',notifications:data.notifications,onRemotePrefs:remote=>{const changed=data.notifications.messages!==(remote.messages_enabled!==false)||((data.notifications.muteUntil||null)!==(remote.mute_until||null));if(changed){data.notifications.messages=remote.messages_enabled!==false;data.notifications.muteUntil=remote.mute_until||null;persist();render()}}})}
function scrollTop(){window.scrollTo({top:0,behavior:'instant'})}
function handleForumAction(a,b){
  if(a==='open-forum'){screen='forum';editing=null;render();scrollTop();return true}
  if(a==='forum-back'){screen='friends';render();scrollTop();return true}
  if(a==='post-message'){
    const key=b.dataset.scope;
    if(key!=='general'&&!W.some(w=>w.id===key))return true;
    const input=document.getElementById('forum-input-'+key),msg=(input?.value||'').trim().slice(0,500);
    if(!msg){toast(ft('postLength'));return true}
    data.localThreads ||= {};
    data.localThreads[key] ||= [];
    const author=(data.friends?.displayName||'').trim().slice(0,32)||ft('author');
    data.localThreads[key].push({id:'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,8),text:msg,author,createdAt:new Date().toISOString()});
    data.localThreads[key]=data.localThreads[key].slice(-100);
    persist();render();toast(ft('postSaved'));return true;
  }
  if(a==='delete-message'){
    const key=b.dataset.scope,messageId=b.dataset.id;
    if(key!=='general'&&!W.some(w=>w.id===key))return true;
    if(!confirm(ft('deleteConfirm')))return true;
    const before=data.localThreads?.[key];if(!Array.isArray(before))return true;
    data.localThreads[key]=before.filter(p=>p.id!==messageId);persist();render();return true;
  }
  if(a==='share-message'){
    const key=b.dataset.scope;
    if(key!=='general'&&!W.some(w=>w.id===key))return true;
    const post=threadPosts(key).find(p=>p.id===b.dataset.id);if(!post)return true;
    const textMsg='My Workout · '+(key==='general'?ft('forum'):key)+'\n'+post.text;
    if(navigator.share){navigator.share({title:'My Workout',text:textMsg}).catch(()=>{})}
    else if(navigator.clipboard?.writeText){navigator.clipboard.writeText(textMsg).then(()=>toast(nt('copied'))).catch(()=>toast(nt('shareFailed')))}
    else toast(ft('sharedCopy'));
    return true;
  }
  if(a==='message-mute'){
    const h=Number(b.dataset.hours);if(![1,8,24,168].includes(h))return true;
    data.notifications ||= {};
    data.notifications.messages=true;
    data.notifications.muteUntil=new Date(Date.now()+h*3600000).toISOString();
    persist();window.MyWorkoutForum?.savePrefs(data.notifications);render();return true;
  }
  if(a==='message-unmute'){
    data.notifications ||= {};data.notifications.messages=true;data.notifications.muteUntil=null;persist();window.MyWorkoutForum?.savePrefs(data.notifications);render();return true;
  }
  return false;
}
function act(e){const b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,id=b.dataset.id,i=Number(b.dataset.ex);if(handleForumAction(a,b))return;
if(a==='exercise-art'){
const chosen=W.flatMap(w=>w.exercises).find(ex=>ex.en===b.dataset.name);
if(!chosen)return;
const dialog=document.getElementById('exercise-art-dialog');
dialog.querySelector('.art-preview-title').textContent=nameEx(chosen);
dialog.querySelector('.art-preview-image').innerHTML=WorkoutIllustrations.render(chosen.en);
dialog.querySelector('.art-preview-caption').textContent=data.lang==='pl'?'Poglądowy schemat ruchu. Nie zastępuje instruktażu prawidłowej techniki.':'Schematic movement illustration, not a form or technique tutorial.';
if(typeof dialog.showModal==='function')dialog.showModal();
return;
}
if(a==='close-art'){document.getElementById('exercise-art-dialog')?.close();return;}

if(a==='make-share'){let name=document.getElementById('friends-name')?.value.trim().slice(0,32)||'';if(!name){toast(tr('nameRequired'));document.getElementById('friends-name')?.focus();return}data.friends.displayName=name;persist();shareCode=encodeProgress(mySnapshot());render();return}
if(a==='copy-share'){let t=document.getElementById('share-code');if(!t)return;t.select();if(navigator.clipboard?.writeText){navigator.clipboard.writeText(t.value).then(()=>toast(tr('codeCopied'))).catch(()=>{t.select();toast(tr('copyFailed'))})}else{let ok=document.execCommand('copy');toast(tr(ok?'codeCopied':'copyFailed'))}return}
if(a==='send-share'){let t=document.getElementById('share-code');if(!t)return;let msg=t.value;if(navigator.share){navigator.share({text:msg}).catch(()=>{})}else{t.select();toast(tr('copyFailed'))}return}
if(a==='add-friend'){let v=document.getElementById('friend-import')?.value||'';try{let o=decodeProgress(v);if(o.n.toLocaleLowerCase()===(data.friends.displayName||'').trim().toLocaleLowerCase())return toast(tr('sameFriend'));data.friends.peers[o.n.toLocaleLowerCase()]=o;persist();render();toast(tr('friendImported'))}catch(_){toast(tr('badFriendCode'))}return}
if(a==='remove-friend'){let key=b.dataset.peer;if(confirm(tr('removeFriendConfirm'))&&Object.hasOwn(data.friends.peers,key)){delete data.friends.peers[key];persist();render()}return}
if(a==='begin-swap'){let w=W.find(w=>w.id===id);if(w&&i>=0&&i<w.exercises.length){swapping=i;render();document.getElementById('swap-choice')?.focus()}return}
if(a==='cancel-swap'){swapping=null;render();return}
if(a==='apply-swap'||a==='restore-swap'){let w=W.find(w=>w.id===id);if(!w||i<0||i>=w.exercises.length)return;let original=w.exercises[i],choice=a==='restore-swap'?original.en:document.getElementById('swap-choice')?.value,selected=EX_CATALOG.find(x=>x.en===choice);if(!selected)return;let ss=session(id),previous=effectiveEx(w,i);if(previous.en!==selected.en){let hasData=!!ss.checked?.[i]||ss.weights?.[i]!==undefined||ss.reps?.[i]!==undefined;if(hasData&&!confirm(ux('swapWarning')))return;clearExercise(w,i);ss.substitutions ||= {};if(selected.en===original.en)delete ss.substitutions[i];else ss.substitutions[i]={en:selected.en,pl:selected.pl};ss.lastCheckedAt=new Date().toISOString();data.lastWorkoutId=id;shareCode='';persist()}swapping=null;render();return}

if(a==='edit-note'){if(!W.some(w=>w.id===id&&i>=0&&i<w.exercises.length))return;noteEditing=id+'_'+i;render();document.getElementById('note-input')?.focus();return}
if(a==='cancel-note'){noteEditing=null;render();return}
if(a==='save-note'){const w=W.find(w=>w.id===id);if(!w||i<0||i>=w.exercises.length)return;const ss=session(id),message=(document.getElementById('note-input')?.value||'').trim().slice(0,500),shared=!!document.getElementById('note-sharing')?.checked;if(message){ss.notes[i]=message;ss.notesShare[i]=shared}else{delete ss.notes[i];delete ss.notesShare[i]}noteEditing=null;persist();render();toast(nt('saved'));return}
if(a==='share-note'){const w=W.find(w=>w.id===id);if(!w||i<0||i>=w.exercises.length)return;const ss=getSession(id),message=ss.notes?.[i];if(!message||!ss.notesShare?.[i])return;const ex=effectiveEx(w,i);const body=(data.lang==='pl'?'Notatka treningowa':'Workout note')+' • '+(data.lang==='pl'?'Tydzień ':'Week ')+w.week+' · '+(data.lang==='pl'?'Dzień ':'Day ')+w.day+'\n'+nameEx(ex)+'\n\n'+message; if(navigator.share){navigator.share({title:'My Workout',text:body}).catch(()=>{})}else if(navigator.clipboard?.writeText){navigator.clipboard.writeText(body).then(()=>toast(nt('copied'))).catch(()=>toast(nt('shareFailed')))}else{const area=document.createElement('textarea');area.value=body;area.style.position='fixed';area.style.top='-9999px';document.body.appendChild(area);area.select();const ok=typeof document.execCommand==='function'&&document.execCommand('copy');area.remove();toast(ok?nt('copied'):nt('shareFailed'))}return}
if(a==='edit-reps'){editing='reps_'+id+'_'+i;render();document.getElementById('rep-input')?.focus();return}
if(a==='save-reps'||a==='clear-reps'){let inp=document.getElementById('rep-input');let raw=a==='clear-reps'?'':inp?.value.trim()||'';let s=session(id);if(raw===''){delete s.reps[i]}else{let n=Number(raw);if(!Number.isSafeInteger(n)||n<0||n>99999){inp?.focus();return}s.reps[i]=n}editing=null;persist();render();return}
if(a==='history'){historyMonth=defaultDate().slice(0,7);screen='history';render();scrollTop();return}
if(a==='history-back'){screen='stats';render();scrollTop();return}
if(a==='history-month'){if(/^\d{4}-\d{2}$/.test(b.dataset.month)){historyMonth=b.dataset.month;render()}return}
if(a==='language'){data.lang=b.dataset.lang==='en'?'en':'pl';persist();render();return}
if(a==='nav'){editing=null;screen=b.dataset.screen==='friends'?'forum':b.dataset.screen;render();scrollTop();return}
if(a==='week'){let w=Number(b.dataset.week);if(w>=1&&w<=12){week=w;screen='plan';editing=null;render();scrollTop()}return}
if(a==='open'){currentID=id;data.lastWorkoutId=id;persist();screen='workout';editing=null;swapping=null;noteEditing=null;render();scrollTop();return}
if(a==='back'){screen='plan';editing=null;swapping=null;noteEditing=null;render();scrollTop();return}
if(a==='tick'){let w=W.find(w=>w.id===id);if(!w||i<0||i>=w.exercises.length)return;setChecked(w,i,!getSession(id).checked?.[i]);shareCode='';persist();render();return}
if(a==='all-ticks'){let w=W.find(x=>x.id===id);if(!w)return;let full=count(w).complete;w.exercises.forEach((_,j)=>setChecked(w,j,!full));shareCode='';persist();render();return}
if(a==='edit-weight'){editing=id+'_'+i;render();let input=document.getElementById('weight-input');input?.focus();return}
if(a==='save-weight'||a==='clear-weight'){let inp=document.getElementById('weight-input'),value=a==='clear-weight'?'':(inp?.value||'');let s=session(id);if(value==='')delete s.weights[i];else{let n=Number(value);if(!Number.isFinite(n)||n<0||n>1000){inp?.focus();return} s.weights[i]=String(n)}editing=null;persist();render();return}
if(a==='export'){let blob=new Blob([JSON.stringify({...data,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='my-workout-backup-'+defaultDate()+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),2500);return}
if(a==='import'){document.getElementById('backup-file').click();return}
if(a==='reset'){if(confirm(tr('resetConfirm'))){let lang=data.lang;data=emptyData();data.lang=lang;week=1;screen='plan';shareCode='';persist();render();toast(tr('resetDone'))}return}
if(a==='install'&&installPrompt){installPrompt.prompt();installPrompt.userChoice.finally(()=>{installPrompt=null;render()});return}
}
document.addEventListener('click',act);
document.addEventListener('change',e=>{
  if(e.target.id==='bruce-date'){
    if(e.target.validity.valid && /^\d{4}-\d{2}-\d{2}$/.test(e.target.value)) bruceDate=e.target.value;
    render(); return;
  }
  if(e.target.dataset.action==='bruce-check'){
    const i=Number(e.target.dataset.ex);
    session('bruce-'+bruceDate).checked[i]=e.target.checked;
    persist(); render();
    el.querySelector('[data-action="bruce-check"][data-ex="'+i+'"]')?.focus({preventScroll:true});
    return;
  }
if(e.target.dataset.action==='message-notify'){data.notifications ||= {};data.notifications.messages=e.target.checked;data.notifications.muteUntil=null;persist();window.MyWorkoutForum?.savePrefs(data.notifications);render();return}if(e.target.dataset.action==='notification-pref'){const k=e.target.dataset.pref;if(!['started','finished','all'].includes(k))return;if(!data.notifications)data.notifications={started:true,finished:true,all:false};data.notifications[k]=e.target.checked;if(k==='all'&&e.target.checked){data.notifications.started=false;data.notifications.finished=false;}else if(k==='all'&&!e.target.checked){data.notifications.started=true;data.notifications.finished=true;}persist();render();return;}let a=e.target.dataset.action,id=e.target.dataset.id;if(a==='date'&&e.target.value){data.dates[id]=e.target.value;persist();toast(tr('saved'))}if(a==='start-date'&&e.target.value){data.startDate=e.target.value;shareCode='';persist();toast(tr('saved'))}if(a==='weight'&&e.target.value!==''){let n=Number(e.target.value);if(Number.isFinite(n)&&n>=0&&n<=1000){session(id).weights[Number(e.target.dataset.ex)]=String(n);persist()}}});
document.addEventListener('change',e=>{if(e.target.id==='friends-name'){data.friends.displayName=e.target.value.trim().slice(0,32);shareCode='';persist()}});
document.getElementById('backup-file').addEventListener('change',async e=>{let file=e.target.files?.[0];if(!file)return;try{let d=JSON.parse(await file.text());if(![1,2].includes(d.version)||!d.sessions||!d.dates||!d.startDate)throw Error('Invalid');if(confirm(tr('importConfirm'))){data=migrate(d);persist();editing=null;shareCode='';screen='plan';week=1;render();toast(tr('imported'))}}catch(err){toast(tr('badImport'))}e.target.value=''});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;render()});
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
render();
})();
</script><dialog class="exercise-art-dialog" id="exercise-art-dialog" aria-labelledby="art-preview-title"><div class="art-preview-body"><div class="art-preview-head"><h2 id="art-preview-title" class="art-preview-title"></h2><button class="art-close" type="button" data-action="close-art" aria-label="Close">×</button></div><div class="art-preview-image"></div><p class="art-preview-caption"></p></div></dialog></body></html>
