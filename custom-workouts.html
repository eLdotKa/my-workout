<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173a34"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="My Workout"><link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png"><link rel="manifest" href="./manifest.webmanifest"><title>My Workouts</title>
<style>
:root{--bg:#f4f6f2;--ink:#1a302c;--muted:#687b70;--line:#dee9df;--deep:#173a34;--green:#157750}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #98d593;outline-offset:2px}.shell{max-width:740px;margin:auto;padding-bottom:30px}.header{background:var(--deep);color:#fff;padding:22px 17px 25px;border-radius:0 0 25px 25px}.head{display:flex;justify-content:space-between;align-items:center}.head a{color:#d6f0d6;text-decoration:none;font-size:12px;font-weight:750}.langs{display:flex;background:#31574d;padding:3px;border-radius:10px}.langs button{border:0;border-radius:8px;background:transparent;color:white;padding:6px 10px;font-size:12px;font-weight:800}.langs .active{background:white;color:var(--deep)}h1{font-size:31px;letter-spacing:-.7px;margin:18px 0 4px}.header p{color:#d3e4d7;margin:0;font-size:13px}main{padding:18px 13px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px}.card h2{font-size:17px;margin:0 0 11px}.muted{color:var(--muted);font-size:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.btn{background:var(--deep);border:0;border-radius:10px;color:white;padding:10px 13px;font-size:13px;font-weight:800}.btn.light{background:#ebf3e9;color:var(--deep)}.btn.danger{background:#fff0ef;color:#ac4946}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.field{display:block;font-size:12px;font-weight:750;color:var(--muted);margin:12px 0}.field input,.field select{width:100%;display:block;margin-top:5px;border:1px solid #d7e3d8;background:#fbfdfb;border-radius:10px;color:var(--ink);padding:10px;min-height:40px}.cols{display:grid;grid-template-columns:80px minmax(0,1fr);gap:10px}.empty{text-align:center;color:var(--muted);font-size:13px;padding:22px 6px}.item{padding:10px 0;border-bottom:1px solid #edf0ed}.item:last-child{border:0}.item strong{font-size:14px}.item small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.progress{background:#e8efe7;border-radius:8px;overflow:hidden;height:7px;margin:11px 0}.progress>div{background:#239463;height:100%}.tickrow{display:grid;grid-template-columns:minmax(0,1fr) 82px 39px;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid #ecf0eb}.tickrow:last-child{border:0}.exname{font-size:13px;font-weight:750}.pres{text-align:center;font-weight:800;font-size:12px}.tick{height:39px;width:39px;border:1.5px solid #c8dccd;color:#5d876b;background:#f5faf6;border-radius:10px;font-size:21px}.tick[aria-pressed=true]{background:#17855c;border-color:#17855c;color:#fff}.iconbutton{display:grid;place-items:center;flex:0 0 36px;height:36px;width:36px;border:1px solid #dce9dd;border-radius:10px;background:#f2f7f0;overflow:hidden;padding:0}.iconbutton svg{width:36px;height:36px}.exlabel{display:flex;align-items:center;gap:7px;min-width:0}.exlabel>div{min-width:0;overflow-wrap:anywhere}.smallbutton{border:0;color:#a24b45;background:none;padding:5px 0;font-size:12px}.hint{background:#ecf3e9;border-radius:12px;padding:11px 12px;color:#526c56;font-size:12px;margin:14px 0}.hidden{display:none!important}dialog{border:0;border-radius:18px;padding:15px;width:min(350px,calc(100vw - 35px));box-shadow:0 20px 60px #0004}dialog::backdrop{background:#10241aaf}dialog svg{width:220px;max-width:100%}.footer{color:var(--muted);font-size:12px;margin-top:15px}#toast{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:var(--deep);color:white;padding:10px 15px;border-radius:10px;font-size:12px;max-width:90vw}
.cnote-view{display:flex;flex-direction:column;align-items:flex-start;gap:4px;margin:5px 0}.cnote-text{font-size:11px;color:#536f5e;white-space:pre-line;word-break:break-word;margin:2px 0}.cnote-edit{background:#f0f7ef;border-radius:10px;padding:9px;margin:7px 0}.cnote-edit textarea{width:100%;min-height:64px;border:1px solid #c5dbcb;border-radius:8px;background:#fff;font:inherit;font-size:12px;padding:7px}.cnote-edit label{display:flex;gap:5px;align-items:center;font-size:11px;margin:8px 0;color:#526f5f}.cnote-edit input{accent-color:#157750}.cnote-edit .buttons{margin-top:4px}.cnote-edit .muted{font-size:10px}
.langs{position:fixed;top:calc(env(safe-area-inset-top) + 12px);right:12px;z-index:30;box-shadow:0 7px 20px #0002}
.header h1{padding-right:90px}
</style></head>
<body><div class="shell"><header class="header"><div class="head"><a href="./" id="back-link">← Main plan</a><div class="langs"><button data-action="lang" data-lang="en">EN</button><button data-action="lang" data-lang="pl">PL</button></div></div><h1 id="title"></h1><p id="subtitle"></p></header><main id="app"></main></div><input id="importfile" type="file" accept=".json,application/json" hidden><dialog id="preview"><div class="row"><strong id="preview-title"></strong><button class="btn light" data-action="close">×</button></div><div id="preview-img" style="text-align:center"></div><p class="muted" id="preview-caption"></p></dialog><div id="toast" hidden></div>
<script src="./workout-catalog.js"></script><script src="./exercise-illustrations.js"></script>
<script>
(()=>{
'use strict';
const KEY='my-workout-custom-v1', MAIN='moj-trening-shortcut-v1';
const dict={
en:{note:'Note',editNote:'Edit note',notePrivate:'Private',noteShare:'Share with friends',noteSend:'Send to friend',noteSave:'Save note',noteCancel:'Cancel',notePlaceholder:'Training tip, grip, load, plan for next time...',noteHint:'Choose your recipient in the phone share menu. No automatic messages.',noteCopied:'Note copied',noteFailed:'Could not send note',title:'My Workouts',sub:'Build your own reusable training checklists.',back:'← Main plan',create:'+ Create workout',name:'Workout name',namePlaceholder:'e.g. Full body',save:'Save',cancel:'Cancel',empty:'You have no custom workouts yet.',exercises:'exercises',sessions:'completed sessions',open:'Open',edit:'Edit',delete:'Delete',deleteConfirm:'Delete this workout and its history?',workout:'Workout',add:'Add exercise',catalog:'Choose from the 12-week plan',custom:'Or enter your own exercise name',select:'Select an exercise',sets:'Sets',reps:'Reps / time',addExercise:'+ Add',remove:'Remove',removeConfirm:'Remove this exercise?',finish:'Finish workout',finishConfirm:'Finish this session and save it?',incomplete:'Tick all exercises before finishing.',clear:'Clear ticks',clearConfirm:'Clear current ticks?',last:'Last completed',noExercises:'Add an exercise to start.',noName:'Enter a workout name.',saved:'Saved',done:'Session completed!',none:'Not started',privacy:'Personal workouts are stored only on this phone and are not counted in the 48-workout Friends ranking.',backup:'Backup',export:'Export custom workouts',import:'Import custom workouts',replace:'Replace all custom workouts with imported data?',badFile:'Invalid file.',backupInfo:'Custom workouts have a separate backup from the 12-week programme.',preview:'Schematic exercise illustration, not a technique tutorial.',progress:'Progress'},
pl:{note:'Notatka',editNote:'Edytuj notatkę',notePrivate:'Prywatna',noteShare:'Udostępnij znajomym',noteSend:'Wyślij znajomemu',noteSave:'Zapisz notatkę',noteCancel:'Anuluj',notePlaceholder:'Wskazówka, chwyt, ciężar, plan na następny raz...',noteHint:'Odbiorcę wybierasz w menu udostępniania telefonu. Brak automatycznych wiadomości.',noteCopied:'Skopiowano notatkę',noteFailed:'Nie udało się wysłać notatki',title:'Moje treningi',sub:'Twórz własne zestawy ćwiczeń i wracaj do nich.',back:'← Plan główny',create:'+ Utwórz trening',name:'Nazwa treningu',namePlaceholder:'np. Całe ciało',save:'Zapisz',cancel:'Anuluj',empty:'Nie masz jeszcze własnych zestawów.',exercises:'ćwiczeń',sessions:'ukończonych sesji',open:'Otwórz',edit:'Edytuj',delete:'Usuń',deleteConfirm:'Usunąć zestaw i jego historię?',workout:'Trening',add:'Dodaj ćwiczenie',catalog:'Wybierz z planu 12 tygodni',custom:'Lub wpisz własną nazwę ćwiczenia',select:'Wybierz ćwiczenie',sets:'Serie',reps:'Powtórzenia / czas',addExercise:'+ Dodaj',remove:'Usuń',removeConfirm:'Usunąć to ćwiczenie?',finish:'Zakończ trening',finishConfirm:'Zakończyć i zapisać sesję?',incomplete:'Najpierw zaznacz wszystkie ćwiczenia.',clear:'Wyczyść ticki',clearConfirm:'Wyczyścić zaznaczenia?',last:'Ostatnio wykonano',noExercises:'Dodaj ćwiczenie, żeby zacząć.',noName:'Wpisz nazwę treningu.',saved:'Zapisano',done:'Trening ukończony!',none:'Jeszcze nie rozpoczęto',privacy:'Własne zestawy są zapisywane tylko na telefonie i nie zwiększają rankingu 48 treningów w Friends.',backup:'Kopia danych',export:'Eksportuj własne treningi',import:'Importuj własne treningi',replace:'Zastąpić wszystkie własne zestawy z kopii?',badFile:'Nieprawidłowy plik.',backupInfo:'Własne zestawy mają osobną kopię od programu 12 tygodni.',preview:'Poglądowy schemat ćwiczenia, nie instruktaż techniki.',progress:'Postęp'}};
const esc=v=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
let lang='en';try{const m=JSON.parse(localStorage.getItem(MAIN)||'null');if(m?.lang==='pl')lang='pl'}catch(e){}
const tr=k=>dict[lang][k]||k;
const fresh=()=>({v:1,routines:[],checks:{},history:[]});
function valid(d){return d&&d.v===1&&Array.isArray(d.routines)&&d.routines.length<=200&&Array.isArray(d.history)&&d.history.length<=2000&&d.checks&&typeof d.checks==='object'&&d.routines.every(r=>typeof r.id==='string'&&typeof r.name==='string'&&r.name.length<=80&&Array.isArray(r.exercises)&&r.exercises.length<=60&&r.exercises.every(e=>typeof e.name==='string'&&e.name.length<=100&&Number.isInteger(e.sets)&&e.sets>=1&&e.sets<=20&&typeof e.target==='string'&&e.target.length<=40))}
let data=fresh();try{const old=JSON.parse(localStorage.getItem(KEY)||'null');if(valid(old))data=old}catch(e){}
let screen='list',id=null,edit=false,showForm=false,noteIndex=null;
const app=document.getElementById('app');
const find=()=>data.routines.find(x=>x.id===id);
const checks=r=>data.checks[r.id]||{};
function persist(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){toast(lang==='pl'?'Brak miejsca na zapis':'Unable to save data')}}
function toast(v){let e=document.getElementById('toast');e.textContent=v;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,1800)}
const icon=(x)=>window.WorkoutIllustrations?.known(x)?window.WorkoutIllustrations.render(x):'<svg viewBox="0 0 96 96" fill="none"><rect width="96" height="96" rx="18" fill="#edf4ec"/><path d="M30 50h36M36 36v28M60 36v28" stroke="#26704b" stroke-width="6" stroke-linecap="round"/></svg>';
function head(){document.documentElement.lang=lang;document.title=tr('title');document.getElementById('title').textContent=tr('title');document.getElementById('subtitle').textContent=tr('sub');document.getElementById('back-link').textContent=tr('back');document.querySelectorAll('[data-action=lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang))}
function list(){return '<section class="card"><div class="row"><h2>'+esc(tr('title'))+'</h2><button class="btn" data-action="new">'+esc(tr('create'))+'</button></div>'+ (data.routines.length?data.routines.map(r=>{const n=Object.values(checks(r)).filter(Boolean).length,c=r.exercises.length,done=data.history.filter(h=>h.id===r.id).length;return '<div class="item"><div class="row"><div><strong>'+esc(r.name)+'</strong><small>'+c+' '+tr('exercises')+' · '+done+' '+tr('sessions')+'</small></div><button class="btn light" data-action="open" data-id="'+esc(r.id)+'">'+esc(tr('open'))+' →</button></div><div class="progress"><div style="width:'+(c?Math.round(n/c*100):0)+'%"></div></div></div>'}).join(''):'<div class="empty">'+esc(tr('empty'))+'</div>')+'</section>'+backup()+'<p class="hint">'+esc(tr('privacy'))+'</p>'}
function backup(){return '<section class="card"><h2>'+esc(tr('backup'))+'</h2><p class="muted">'+esc(tr('backupInfo'))+'</p><div class="buttons"><button class="btn light" data-action="export">'+esc(tr('export'))+'</button><button class="btn light" data-action="import">'+esc(tr('import'))+'</button></div></section>'}
function editor(r){return '<section class="card"><h2>'+esc(r?tr('edit'):tr('create'))+'</h2><label class="field">'+esc(tr('name'))+'<input maxlength="80" id="routine-name" required placeholder="'+esc(tr('namePlaceholder'))+'" value="'+esc(r?.name||'')+'"></label><div class="buttons"><button class="btn" data-action="save-routine">'+esc(tr('save'))+'</button><button class="btn light" data-action="cancel">'+esc(tr('cancel'))+'</button></div></section>'}
function form(){return '<section class="card"><h2>'+esc(tr('add'))+'</h2><label class="field">'+esc(tr('catalog'))+'<select id="catalog"><option value="">'+esc(tr('select'))+'</option>'+window.WorkoutCatalog.map((x,i)=>'<option value="'+i+'">'+esc(lang==='pl'?x.pl:x.en)+'</option>').join('')+'</select></label><label class="field">'+esc(tr('custom'))+'<input id="custom-name" maxlength="100" placeholder="'+esc(tr('custom'))+'"></label><div class="cols"><label class="field">'+esc(tr('sets'))+'<input id="custom-sets" type="number" min="1" max="20" value="3"></label><label class="field">'+esc(tr('reps'))+'<input id="custom-target" maxlength="40" value="10–12"></label></div><div class="buttons"><button class="btn" data-action="add-ex">'+esc(tr('addExercise'))+'</button><button class="btn light" data-action="hide-form">'+esc(tr('cancel'))+'</button></div></section>'}
function exerciseNote(e,i){const isEditing=noteIndex===i,has=typeof e.note==='string'&&!!e.note.trim(),shared=e.share===true;return isEditing?'<div class="cnote-edit"><textarea id="custom-note-input" maxlength="500" placeholder="'+esc(tr('notePlaceholder'))+'">'+esc(e.note||'')+'</textarea><label><input type="checkbox" id="custom-note-share" '+(shared?'checked':'')+'> '+esc(tr('noteShare'))+'</label><div class="buttons"><button class="btn" data-action="save-note" data-ex="'+i+'">'+esc(tr('noteSave'))+'</button><button class="btn light" data-action="cancel-note">'+esc(tr('noteCancel'))+'</button></div><p class="muted">'+esc(tr('noteHint'))+'</p></div>':'<div class="cnote-view"><button class="smallbutton" data-action="edit-note" data-ex="'+i+'">✎ '+esc(has?tr('editNote'):tr('note'))+' · '+esc(shared?tr('noteShare'):tr('notePrivate'))+'</button>'+(has?'<p class="cnote-text">'+esc(e.note)+'</p>':'')+(has&&shared?'<button class="btn light" data-action="send-note" data-ex="'+i+'">'+esc(tr('noteSend'))+' ↗</button>':'')+'</div>'}
function detail(){let r=find();if(!r)return list();const c=checks(r),done=r.exercises.filter((_,i)=>c[i]).length,all=r.exercises.length,history=data.history.filter(h=>h.id===r.id).slice(-1)[0];return '<button class="btn light" data-action="back" style="margin-bottom:13px">← '+esc(tr('title'))+'</button><section class="card"><div class="row"><h2>'+esc(r.name)+'</h2><button class="btn light" data-action="rename">'+esc(tr('edit'))+'</button></div><p class="muted">'+done+'/'+all+' '+esc(tr('exercises'))+(history?' · '+esc(tr('last'))+': '+new Date(history.at).toLocaleDateString(lang==='pl'?'pl-PL':'en-GB'):'')+'</p><div class="progress"><div style="width:'+(all?Math.round(done/all*100):0)+'%"></div></div>'+ (r.exercises.length?r.exercises.map((e,i)=>'<div class="tickrow"><div class="exlabel"><button class="iconbutton" data-action="preview" data-ex="'+i+'" aria-label="Preview">'+icon(e.catalog||e.name)+'</button><div><div class="exname">'+esc(e.catalog&&lang==='pl'&&window.WorkoutCatalog.find(x=>x.en===e.catalog)?window.WorkoutCatalog.find(x=>x.en===e.catalog).pl:e.name)+'</div><button class="smallbutton" data-action="remove-ex" data-ex="'+i+'">'+esc(tr('remove'))+'</button>'+exerciseNote(e,i)+'</div></div><div class="pres">'+e.sets+' × '+esc(e.target)+'</div><button class="tick" data-action="tick" data-ex="'+i+'" aria-pressed="'+!!c[i]+'">'+(c[i]?'✓':'')+'</button></div>').join(''):'<div class="empty">'+esc(tr('noExercises'))+'</div>')+'<div class="buttons"><button class="btn light" data-action="toggle-form">'+esc(tr('add'))+'</button><button class="btn" data-action="finish" '+(!all?'disabled':'')+'>'+esc(tr('finish'))+'</button><button class="btn light" data-action="clear">'+esc(tr('clear'))+'</button></div></section>'+(showForm?form():'')+'<button class="btn danger" data-action="delete">'+esc(tr('delete'))+'</button><p class="hint">'+esc(tr('privacy'))+'</p>'}
function render(){head();app.innerHTML=screen==='create'?editor():screen==='rename'?editor(find()):screen==='detail'?detail():list()}
function newID(){return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
app.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='edit-note'){const idx=Number(b.dataset.ex);if(!find()?.exercises[idx])return;noteIndex=idx;render();document.getElementById('custom-note-input')?.focus();return}if(a==='cancel-note'){noteIndex=null;render();return}if(a==='save-note'){const idx=Number(b.dataset.ex),ex=find()?.exercises[idx];if(!ex)return;ex.note=(document.getElementById('custom-note-input')?.value||'').trim().slice(0,500);ex.share=!!ex.note&&!!document.getElementById('custom-note-share')?.checked;noteIndex=null;persist();render();toast(tr('saved'));return}if(a==='send-note'){const idx=Number(b.dataset.ex),r=find(),ex=r?.exercises[idx];if(!ex?.note||!ex.share)return;const text='My Workout · '+r.name+'\n'+ex.name+'\n\n'+ex.note;if(navigator.share){navigator.share({title:'My Workout',text}).catch(()=>{})}else if(navigator.clipboard?.writeText){navigator.clipboard.writeText(text).then(()=>toast(tr('noteCopied'))).catch(()=>toast(tr('noteFailed')))}else toast(tr('noteFailed'));return}if(a==='new'){screen='create';render();return}if(a==='cancel'){screen=id?'detail':'list';render();return}if(a==='save-routine'){const n=document.getElementById('routine-name').value.trim();if(!n)return toast(tr('noName'));if(screen==='create'){id=newID();data.routines.push({id,name:n,exercises:[]})}else find().name=n;showForm=false;screen='detail';persist();render();return}if(a==='back'){screen='list';id=null;showForm=false;noteIndex=null;render();return}if(a==='open'){id=b.dataset.id;showForm=false;noteIndex=null;screen='detail';render();return}if(a==='rename'){screen='rename';render();return}if(a==='toggle-form'){showForm=!showForm;render();return}if(a==='hide-form'){showForm=false;render();return}if(a==='add-ex'){const idx=document.getElementById('catalog').value,custom=document.getElementById('custom-name').value.trim();const cat=idx===''?null:window.WorkoutCatalog[Number(idx)];const name=custom||cat?.en;if(!name)return toast(tr('noName'));const sets=Math.min(20,Math.max(1,parseInt(document.getElementById('custom-sets').value)||3));const target=document.getElementById('custom-target').value.trim().slice(0,40)||'10–12';find().exercises.push({name,sets,target,catalog:custom?'':cat.en});showForm=false;persist();render();toast(tr('saved'));return}if(a==='remove-ex'){if(!confirm(tr('removeConfirm')))return;const i=Number(b.dataset.ex);find().exercises.splice(i,1);const prev=checks(find()),next={};Object.entries(prev).forEach(([k,v])=>{const n=Number(k);if(n<i)next[n]=v;else if(n>i)next[n-1]=v});data.checks[id]=next;persist();render();return}if(a==='tick'){const i=Number(b.dataset.ex);if(!data.checks[id])data.checks[id]={};data.checks[id][i]=!data.checks[id][i];persist();render();return}if(a==='finish'){const r=find(),c=checks(r);if(!r.exercises.length||!r.exercises.every((_,i)=>c[i]))return toast(tr('incomplete'));if(!confirm(tr('finishConfirm')))return;data.history.push({id:r.id,at:new Date().toISOString(),total:r.exercises.length});data.checks[id]={};persist();render();toast(tr('done'));return}if(a==='clear'){if(confirm(tr('clearConfirm'))){data.checks[id]={};persist();render()}return}if(a==='delete'){if(!confirm(tr('deleteConfirm')))return;data.routines=data.routines.filter(r=>r.id!==id);data.history=data.history.filter(h=>h.id!==id);delete data.checks[id];id=null;screen='list';persist();render();return}if(a==='export'){const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const l=document.createElement('a');l.href=url;l.download='my-custom-workouts.json';l.click();setTimeout(()=>URL.revokeObjectURL(url),3000);return}if(a==='import'){document.getElementById('importfile').click();return}if(a==='preview'){let ex=find().exercises[Number(b.dataset.ex)];document.getElementById('preview-title').textContent=ex.name;document.getElementById('preview-img').innerHTML=icon(ex.catalog||ex.name);document.getElementById('preview-caption').textContent=tr('preview');document.getElementById('preview').showModal();return}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;if(b.dataset.action==='lang'){lang=b.dataset.lang;try{const main=JSON.parse(localStorage.getItem(MAIN)||'null');if(main&&typeof main==='object'){main.lang=lang;localStorage.setItem(MAIN,JSON.stringify(main))}}catch(_){}render()}if(b.dataset.action==='close')document.getElementById('preview').close()});
document.getElementById('importfile').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!valid(d))throw Error();if(confirm(tr('replace'))){data=d;screen='list';id=null;persist();render()}}catch(_){toast(tr('badFile'))}e.target.value=''});
render();
})();
</script></body></html>
